<article class="project-card">
  <header class="project-card__header">
    <h2 class="project-card__title">{{ include.project.title }}</h2>
    {% if include.project.tags %}
    <p class="project-card__tags">{{ include.project.tags | join: ' · ' }}</p>
    {% endif %}
  </header>
  <p class="project-card__summary">{{ include.project.description }}</p>
  <footer class="project-card__footer">
    {% if include.project.url %}
    <a class="project-card__link" href="{{ include.project.url }}" target="_blank" rel="noreferrer noopener">View project</a>
    {% endif %}
  </footer>
</article>

<header class="site-header">
    <div class="site-header__inner">
        <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle menu">
            <span class="nav-toggle__line"></span>
            <span class="nav-toggle__line"></span>
            <span class="nav-toggle__line"></span>
        </button>
        <nav id="primary-nav" class="site-nav" aria-label="Primary navigation">
            <ul>
                {% for item in site.nav %}
                {% assign item_url = item.url | relative_url %}
                {% assign is_active = false %}
                {% if page.url == item.url or page.url == item.url | append: '/' %}
                    {% assign is_active = true %}
                {% endif %}
                <li>
                    <a href="{{ item_url }}"{% if is_active %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
                </li>
                {% endfor %}
            </ul>
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Toggle light and dark mode">
            <span class="theme-toggle__icon" aria-hidden="true">&#9790;</span>
        </button>
    </div>
</header>

title: William Nunes
tagline: AI agents in production
email: will.nunes@proton.me
description: "William Nunes builds AI agents, workflow automation and the secure foundations they run on, turning manual operations into software that runs in production."
url: "https://williamnunes.com"
baseurl: ""
image:
  path: /assets/images/og-default.jpg
  alt: "William Nunes — Workplace Automation Engineer"
  width: 1200
  height: 630
markdown: kramdown
permalink: pretty
sass:
  style: expanded
exclude:
  - AGENTS.md
  - .jekyll-metadata
  - output
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle
  - README.md
  - tmp
  - bin
  - package.json
  - package-lock.json
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
      image:
        path: /assets/images/og-default.jpg
        alt: "William Nunes — Workplace Automation Engineer"
        width: 1200
        height: 630
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
nav:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Projects
    url: /projects/

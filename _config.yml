title: William Nunes
tagline: Automating IT with Python
email: will.nunes@proton.me
description: Personal site for William Nunes showcasing automation-focused IT work.
url: "https://williamnunes.com"
baseurl: ""
image:
  path: /assets/images/willmatrix.jpg
  alt: "William Nunes — Workplace Automation Engineer"
  width: 765
  height: 1024
twitter:
  card: summary_large_image
markdown: kramdown
permalink: pretty
sass:
  style: expanded
exclude:
  - AGENTS.md
  - .jekyll-metadata
  - output
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle
  - README.md
  - tmp
  - bin
  - package.json
  - package-lock.json
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
      image:
        path: /assets/images/willmatrix.jpg
        alt: "William Nunes — Workplace Automation Engineer"
        width: 765
        height: 1024
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
nav:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Projects
    url: /projects/

- title: Laya Computer Use
  kind: private
  description: Local macOS computer-use agent in which every action decision comes from an on-device Apple Silicon model, paired with capture tooling and an offline evaluation harness that scores decision strategies.
  impact: Applies measured, repeatable evaluation to desktop automation instead of guesswork.
  tags: "#Python #macOS #MLX #AI #Automation"

- title: Homelab
  kind: private
  description: "Single-node Proxmox lab running n8n, Home Assistant and an AI agent, managed with Ansible: snapshot-guarded weekly updates, generated state snapshots, ADRs and runbooks."
  impact: "Operations discipline at home: reversible changes, documented decisions and tested automation."
  tags: "#Proxmox #Ansible #n8n #HomeAssistant #Runbooks"

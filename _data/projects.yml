- title: Nude Notes
  kind: app
  description: "Translucent menu-bar Markdown notes for macOS: global shortcut, multi-window notes, pinning, search and auto-save to plain files."
  impact: A shipped cross-stack desktop app — Rust backend, React front end, tests on both sides — delivered end to end with a downloadable release.
  tags: "#Tauri #Rust #React #TypeScript #macOS"

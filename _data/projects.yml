- title: DockStay
  kind: app
  description: Menu-bar macOS app that keeps the Dock pinned to the display you choose and recovers automatically after sleep, display changes or disconnects.
  impact: Fixes a real multi-monitor annoyance natively in Swift, with a universal build and a CI release pipeline that verifies architectures and the code signature.
  tags: "#Swift #SwiftUI #macOS #CI"

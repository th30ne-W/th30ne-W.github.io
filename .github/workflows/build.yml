name: Build Jekyll site

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec jekyll build --config _config.yml,_config.ci.yml
      - name: Serve built site
        run: python3 -m http.server 9000 -d _site &
      - name: Lighthouse (mobile)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          temporaryPublicStorage: true
      - name: Lighthouse (desktop)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.desktop.json
          temporaryPublicStorage: true
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200..=299,403,429 --exclude 'linkedin\.com' --exclude 'localhost:4000' --root-dir '${{ github.workspace }}/_site' '_site/**/*.html'
          fail: true

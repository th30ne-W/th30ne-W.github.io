<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preload" href="{{ '/assets/fonts/open-sans-400.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ '/assets/fonts/orbitron-700.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme') || 'dark';
                document.documentElement.setAttribute('data-theme', t);
                document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#eef2f1' : '#0d0d0d';
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <a href="#content" class="skip-link">Skip to content</a>
    <canvas id="background-animation" aria-hidden="true"></canvas>

    {% include header.html %}

    <main id="content" tabindex="-1">
        {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/scripts.js' | relative_url }}" defer></script>
</body>
</html>

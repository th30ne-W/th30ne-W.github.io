---
layout: default
---
<section class="page-header">
  <p class="eyebrow">{{ page.eyebrow | default: site.subtitle }}</p>
  <h1 class="page-title">{{ page.title }}</h1>
  {% if page.intro %}
  <p class="page-intro">{{ page.intro }}</p>
  {% endif %}
</section>

<section class="page-content">
  {{ content }}
</section>
